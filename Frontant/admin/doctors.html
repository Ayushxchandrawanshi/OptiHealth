<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiHealth | Manage Doctors</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/table.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../assets/logo/logo.png" alt="Logo">
                <h2>OptiHealth</h2>
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="active">
                    <a href="doctors.html">
                        <i class="fa-solid fa-user-doctor"></i>
                        <span>Doctors</span>
                    </a>
                </li>
                <li>
                    <a href="patients.html">
                        <i class="fa-solid fa-users"></i>
                        <span>Patients</span>
                    </a>
                </li>
                <li>
                    <a href="appointments.html">
                        <i class="fa-solid fa-calendar-check"></i>
                        <span>Appointments</span>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div>
                    <h2>Manage Doctors</h2>
                    <p>Add, Update and Delete Doctors</p>
                </div>
                <div class="topbar-right">
                    <img src="../assets/images/admin.png" alt="Admin">
                </div>
            </header>
            <section class="dashboard-section">
                <div class="card">
                    <div class="section-header">
                        <h2>Doctor List</h2>
                        <button class="doctor-btn" onclick="openDoctorModal()">
                            <i class="fa-solid fa-plus"></i>
                            Add Doctor
                        </button>
                    </div>
                    <div style="margin:20px 0;">
                        <input type="text" id="searchDoctor" class="form-control" placeholder="Search Doctor By Name..."
                            onkeyup="searchDoctor()">
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Specialization</th>
                                    <th>Experience</th>
                                    <th>Fee</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="doctorTable">
                                <tr>
                                    <td colspan="7" style="text-align:center;padding:35px;">
                                        Loading Doctors...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
            <div class="modal" id="doctorModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="modalTitle">Add Doctor</h2>
                        <button class="close-btn" onclick="closeDoctorModal()">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <form id="doctorForm">
                        <input type="hidden" id="doctorId">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Doctor Name</label>
                                <input type="text" id="doctorName" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="doctorEmail" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="doctorPassword" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Specialization</label>
                                <input type="text" id="doctorSpecialization" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Experience (Years)</label>
                                <input type="number" id="doctorExperience" class="form-control" min="0" required>
                            </div>
                            <div class="form-group">
                                <label>Consultation Fee (₹)</label>
                                <input type="number" id="doctorFee" class="form-control" min="0" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="doctorDescription" class="form-control" rows="4"></textarea>
                        </div>
                        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
                            <button type="button" class="delete-btn" onclick="closeDoctorModal()">Cancel</button>
                            <button type="submit" class="doctor-btn">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save Doctor
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <div class="loader"></div>
    <div class="back-to-top">
        <i class="fa-solid fa-arrow-up"></i>
    </div>
    <script src="../js/navbar.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-doctors.js"></script>
    <script>
        requireRole("ADMIN");
        const admin = getUserData();
        if (!admin) {
            window.location.href = "../login.html";
        }
    </script>
</body>

</html>
