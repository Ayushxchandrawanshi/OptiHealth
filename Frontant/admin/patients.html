<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiHealth | Manage Patients</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/table.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../assets/logo/logo.png" alt="Logo">
                <h2>OptiHealth</h2>
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="doctors.html">
                        <i class="fa-solid fa-user-doctor"></i>
                        <span>Doctors</span>
                    </a>
                </li>
                <li class="active">
                    <a href="patients.html">
                        <i class="fa-solid fa-users"></i>
                        <span>Patients</span>
                    </a>
                </li>
                <li>
                    <a href="appointments.html">
                        <i class="fa-solid fa-calendar-check"></i>
                        <span>Appointments</span>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div>
                    <h2>Manage Patients</h2>
                    <p>Add, Update and Delete Patients</p>
                </div>
                <div class="topbar-right">
                    <img src="../assets/images/admin.png" alt="Admin">
                </div>
            </header>
            <section class="dashboard-section">
                <div class="card">
                    <div class="section-header">
                        <h2>Patient List</h2>
                        <button class="doctor-btn" onclick="openPatientModal()">
                            <i class="fa-solid fa-plus"></i>
                            Add Patient
                        </button>
                    </div>
                    <div style="margin:20px 0;">
                        <input type="text" id="searchPatient" class="form-control"
                            placeholder="Search Patient By Name..." onkeyup="searchPatient()">
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Gender</th>
                                    <th>DOB</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="patientTable">
                                <tr>
                                    <td colspan="7" style="text-align:center;padding:35px;">
                                        Loading Patients...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
            <div class="modal" id="patientModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="modalTitle">Add Patient</h2>
                        <button class="close-btn" onclick="closePatientModal()">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <form id="patientForm">
                        <input type="hidden" id="patientId">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="patientName" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="patientEmail" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="text" id="patientPhone" class="form-control" maxlength="10" required>
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="patientPassword" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Gender</label>
                                <select id="patientGender" class="form-control" required>
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Date of Birth</label>
                                <input type="date" id="patientDob" class="form-control" required>
                            </div>
                        </div>
                        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
                            <button type="button" class="delete-btn" onclick="closePatientModal()">Cancel</button>
                            <button type="submit" class="doctor-btn">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save Patient
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <div class="loader"></div>
    <div class="back-to-top">
        <i class="fa-solid fa-arrow-up"></i>
    </div>
    <script src="../js/navbar.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-patients.js"></script>
    <script>
        requireRole("ADMIN");
        const admin = getUserData();
        if (!admin) {
            window.location.href = "../login.html";
        }
    </script>
</body>

</html>
