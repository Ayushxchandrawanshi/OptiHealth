<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OptiHealth | Doctor Register</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                <img src="assets/logo/logo.png" alt="Logo">
                <h2>OptiHealth</h2>
            </a>

            <ul class="nav-menu">

                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="doctors.html">Doctors</a></li>
                <li><a href="contact.html">Contact</a></li>

                <li>
                    <a href="login.html" class="login-btn">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login
                    </a>
                </li>

            </ul>

            <div class="menu-toggle">
                <i class="fa-solid fa-bars"></i>
            </div>

        </div>

    </nav>

    <section class="login-page">

        <div class="login-overlay"></div>

        <div class="floating-icon icon-one">
            <i class="fa-solid fa-user-doctor"></i>
        </div>

        <div class="floating-icon icon-two">
            <i class="fa-solid fa-stethoscope"></i>
        </div>

        <div class="floating-icon icon-three">
            <i class="fa-solid fa-heart-pulse"></i>
        </div>

        <div class="floating-icon icon-four">
            <i class="fa-solid fa-notes-medical"></i>
        </div>

        <div class="login-container">

            <div class="login-card" data-aos="zoom-in">

                <div class="login-icon">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>

                <h1>Doctor Register</h1>

                <p>Create your doctor account</p>

                <form id="doctorRegisterForm">

                    <div class="input-group">
                        <label>Doctor Name</label>
                        <div class="input-box">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="fullName" placeholder="Enter full name" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <div class="input-box">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" placeholder="Enter email" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Phone</label>
                        <div class="input-box">
                            <i class="fa-solid fa-phone"></i>
                            <input type="text" id="phone" placeholder="Enter phone number" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Gender</label>
                        <div class="input-box">
                            <i class="fa-solid fa-venus-mars"></i>
                            <select id="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Specialization</label>
                        <div class="input-box">
                            <i class="fa-solid fa-user-doctor"></i>
                            <input type="text" id="specialization" placeholder="Enter specialization" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Qualification</label>
                        <div class="input-box">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <input type="text" id="qualification" placeholder="Enter qualification" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Experience (Years)</label>
                        <div class="input-box">
                            <i class="fa-solid fa-briefcase"></i>
                            <input type="number" id="experience" placeholder="Enter experience" min="0" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Create password" required>
                            <i class="fa-solid fa-eye" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Confirm Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                        </div>
                    </div>

                    <button type="submit" class="login-submit">
                        <i class="fa-solid fa-user-plus"></i>
                        Register
                    </button>

                    <div class="divider">
                        <span>OR</span>
                    </div>

                    <p class="register-text">
                        Already have an account?
                    </p>

                    <div class="register-buttons">

                        <a href="login.html" class="doctor-btn">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            Login
                        </a>

                        <a href="patient-register.html" class="patient-btn">
                            <i class="fa-solid fa-user"></i>
                            Patient Register
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </section>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });

        const togglePassword = document.getElementById("togglePassword");
        const password = document.getElementById("password");

        if (togglePassword) {
            togglePassword.addEventListener("click", () => {
                if (password.type === "password") {
                    password.type = "text";
                    togglePassword.classList.replace("fa-eye", "fa-eye-slash");
                } else {
                    password.type = "password";
                    togglePassword.classList.replace("fa-eye-slash", "fa-eye");
                }
            });
        }
    </script>

    <script src="js/navbar.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/doctor.js"></script>

</body>

</html>
