<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OptiHealth | Doctor Profile</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animation.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <div class="sidebar-logo">

                <img src="../assets/logo/logo.png" alt="Logo">

                <h2>OptiHealth</h2>

            </div>

            <ul class="sidebar-menu">

                <li>

                    <a href="dashboard.html">

                        <i class="fa-solid fa-house"></i>

                        <span>Dashboard</span>

                    </a>

                </li>

                <li>

                    <a href="appointments.html">

                        <i class="fa-solid fa-calendar-check"></i>

                        <span>Appointments</span>

                    </a>

                </li>

                <li class="active">

                    <a href="profile.html">

                        <i class="fa-solid fa-user-doctor"></i>

                        <span>Profile</span>

                    </a>

                </li>

                <li>

                    <a href="#" onclick="logout()">

                        <i class="fa-solid fa-right-from-bracket"></i>

                        <span>Logout</span>

                    </a>

                </li>

            </ul>

        </aside>

        <main class="main-content">

            <header class="topbar">

                <div>

                    <h2>

                        Doctor Profile

                    </h2>

                    <p>

                        View your professional information.

                    </p>

                </div>

                <div class="topbar-right">

                    <img src="../assets/images/doctor.png" alt="Doctor">

                </div>

            </header>

            <section class="dashboard-section">

                <div class="card">

                    <div style="text-align:center;margin-bottom:30px;">

                        <img src="../assets/images/doctor.png"
                            style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:5px solid #2563EB;">

                        <h2 id="doctorName">

                            Doctor

                        </h2>

                        <p style="color:#64748B;">

                            OptiHealth Doctor

                        </p>

                    </div>

                    <form id="doctorProfileForm">

                        <div class="form-row">

                            <div class="form-group">

                                <label>Doctor Name</label>

                                <input type="text" id="doctorNameField" class="form-control" readonly>

                            </div>

                            <div class="form-group">

                                <label>Email</label>

                                <input type="email" id="email" class="form-control" readonly>

                            </div>

                        </div>
                        <div class="form-row">

                            <div class="form-group">

                                <label>Specialization</label>

                                <input type="text" id="specialization" class="form-control" readonly>

                            </div>

                            <div class="form-group">

                                <label>Experience (Years)</label>

                                <input type="text" id="experience" class="form-control" readonly>

                            </div>

                        </div>

                        <div class="form-row">

                            <div class="form-group">

                                <label>Consultation Fee (₹)</label>

                                <input type="text" id="fee" class="form-control" readonly>

                            </div>

                            <div class="form-group">

                                <label>Password</label>

                                <input type="password" id="password" class="form-control" readonly>

                            </div>

                        </div>

                        <div class="form-group">

                            <label>Description</label>

                            <textarea id="description" class="form-control" rows="5" readonly></textarea>

                        </div>

                        <div style="margin-top:30px;display:flex;gap:15px;justify-content:center;flex-wrap:wrap;">

                            <a href="dashboard.html" class="doctor-btn">

                                <i class="fa-solid fa-house"></i>

                                Dashboard

                            </a>

                            <a href="appointments.html" class="doctor-btn">

                                <i class="fa-solid fa-calendar-check"></i>

                                Appointments

                            </a>

                        </div>

                    </form>

                </div>

            </section>
        </main>

    </div>

    <div class="loader"></div>

    <div class="back-to-top">
        <i class="fa-solid fa-arrow-up"></i>
    </div>

    <script src="../js/navbar.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/doctor-profile.js"></script>

    <script>

        requireRole("DOCTOR");

        const doctor = getUserData();

        if (!doctor) {
            window.location.href = "../login.html";
        }

        document.getElementById("doctorName").innerText = doctor.doctorName || "Doctor";
        document.getElementById("doctorNameField").value = doctor.doctorName || "";
        document.getElementById("email").value = doctor.email || "";
        document.getElementById("specialization").value = doctor.specialization || "";
        document.getElementById("experience").value = doctor.experience || "";
        document.getElementById("fee").value = doctor.fee || "";
        document.getElementById("password").value = doctor.password || "";
        document.getElementById("description").value = doctor.description || "";

    </script>

</body>

</html>
