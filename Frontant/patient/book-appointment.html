<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment | OptiHealth</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animation.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <div class="sidebar-logo">
                <img src="../assets/logo/logo.png" alt="Logo">
                <h2>OptiHealth</h2>
            </div>

            <ul class="sidebar-menu">

                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="doctors.html">
                        <i class="fa-solid fa-user-doctor"></i>
                        <span>Doctors</span>
                    </a>
                </li>

                <li class="active">
                    <a href="book-appointment.html">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span>Book Appointment</span>
                    </a>
                </li>

                <li>
                    <a href="appointments.html">
                        <i class="fa-solid fa-calendar-check"></i>
                        <span>My Appointments</span>
                    </a>
                </li>

                <li>
                    <a href="profile.html">
                        <i class="fa-solid fa-user"></i>
                        <span>Profile</span>
                    </a>
                </li>

                <li>
                    <a href="#" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div>
                    <h2>Book Appointment</h2>
                    <p>Select doctor and schedule your appointment.</p>
                </div>
            </header>
            <div class="card">
                <form id="appointmentForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Select Doctor</label>
                            <select id="doctorId" class="form-control" required>
                                <option value="">Choose Doctor</option>
                                <option value="1">Dr. Raj Sharma - Cardiologist</option>
                                <option value="2">Dr. Priya Verma - Neurologist</option>
                                <option value="3">Dr. Amit Singh - Orthopedic</option>
                                <option value="4">Dr. Neha Gupta - Dermatologist</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Department</label>
                            <select id="department" class="form-control" required>
                                <option value="">Select Department</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Neurology">Neurology</option>
                                <option value="Orthopedic">Orthopedic</option>
                                <option value="Dermatology">Dermatology</option>
                                <option value="General Medicine">General Medicine</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Appointment Date</label>
                            <input type="date" id="appointmentDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Time Slot</label>
                            <select id="timeSlot" class="form-control" required>
                                <option value="">Select Time</option>
                                <option>09:00 AM</option>
                                <option>09:30 AM</option>
                                <option>10:00 AM</option>
                                <option>10:30 AM</option>
                                <option>11:00 AM</option>
                                <option>11:30 AM</option>
                                <option>12:00 PM</option>
                                <option>02:00 PM</option>
                                <option>02:30 PM</option>
                                <option>03:00 PM</option>
                                <option>03:30 PM</option>
                                <option>04:00 PM</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Priority</label>
                            <select id="priority" class="form-control">
                                <option value="Normal">Normal</option>
                                <option value="Urgent">Urgent</option>
                                <option value="Emergency">Emergency</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Patient Age</label>
                            <input type="number" id="age" class="form-control" placeholder="Enter Age" required>
                        </div>
                    </div>
                    <div class="form-group">

                        <label>Symptoms</label>

                        <input type="text" id="symptoms" class="form-control" placeholder="e.g. Fever, Headache, Cough"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Problem Description</label>
                        <textarea id="description" class="form-control" rows="5"
                            placeholder="Describe your health problem..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Medical History (Optional)</label>
                        <textarea id="medicalHistory" class="form-control" rows="4"
                            placeholder="Previous diseases, surgeries, allergies, medications etc."></textarea>
                    </div>
                    <div class="form-row">
                        <button type="submit" class="form-btn">
                            <i class="fa-solid fa-calendar-check"></i>
                            Book Appointment
                        </button>
                        <button type="reset" class="doctor-btn">
                            <i class="fa-solid fa-rotate-left"></i>
                            Reset
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div class="loader"></div>
    <div class="back-to-top">
        <i class="fa-solid fa-arrow-up"></i>
    </div>

    <script src="../js/navbar.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/patient.js"></script>
    <script src="../js/appointment.js"></script>
    <script src="../js/dashboard.js"></script>

    <script>
        requireRole("PATIENT");
        const today = new Date().toISOString().split("T")[0];
        document.getElementById("appointmentDate").min = today;
        document.getElementById("appointmentForm").addEventListener("submit", function (e) {
            e.preventDefault();
            bookAppointment();
        });
    </script>
</body>

</html>
