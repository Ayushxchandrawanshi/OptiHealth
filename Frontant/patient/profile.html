<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OptiHealth | Patient Profile</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animation.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <div class="sidebar-logo">
                <img src="../assets/logo/logo.png" alt="Logo">
                <h2>OptiHealth</h2>
            </div>

            <ul class="sidebar-menu">

                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="doctors.html">
                        <i class="fa-solid fa-user-doctor"></i>
                        <span>Doctors</span>
                    </a>
                </li>

                <li>
                    <a href="book-appointment.html">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span>Book Appointment</span>
                    </a>
                </li>

                <li>
                    <a href="appointments.html">
                        <i class="fa-solid fa-calendar-check"></i>
                        <span>My Appointments</span>
                    </a>
                </li>

                <li class="active">
                    <a href="profile.html">
                        <i class="fa-solid fa-user"></i>
                        <span>Profile</span>
                    </a>
                </li>

                <li>
                    <a href="#" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>
                </li>

            </ul>

        </aside>

        <main class="main-content">

            <header class="topbar">

                <div>

                    <h2>

                        My Profile

                    </h2>

                    <p>

                        Manage your personal information.

                    </p>

                </div>

                <div class="topbar-right">

                    <img src="../assets/images/patient.png" alt="Patient">

                </div>

            </header>

            <section class="dashboard-section">

                <div class="card">

                    <div style="text-align:center;margin-bottom:30px;">

                        <img src="../assets/images/patient.png"
                            style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:5px solid #2563eb;">

                        <h2 id="profileName" style="margin-top:15px;">
                            Patient Name
                        </h2>

                        <p style="color:#64748b;">
                            OptiHealth Patient
                        </p>

                    </div>

                    <form id="profileForm">

                        <div class="form-row">

                            <div class="form-group">

                                <label>Full Name</label>

                                <input type="text" id="fullName" class="form-control" readonly>

                            </div>

                            <div class="form-group">

                                <label>Email</label>

                                <input type="email" id="email" class="form-control" readonly>

                            </div>

                        </div>
                        <div class="form-row">

                            <div class="form-group">

                                <label>Phone Number</label>

                                <input type="text" id="phone" class="form-control" readonly>

                            </div>

                            <div class="form-group">

                                <label>Gender</label>

                                <input type="text" id="gender" class="form-control" readonly>

                            </div>

                        </div>

                        <div class="form-row">

                            <div class="form-group">

                                <label>Date of Birth</label>

                                <input type="text" id="dob" class="form-control" readonly>

                            </div>

                            <div class="form-group">

                                <label>Password</label>

                                <input type="password" id="password" class="form-control" readonly>

                            </div>

                        </div>

                        <div style="margin-top:30px;display:flex;gap:15px;justify-content:center;">

                            <a href="dashboard.html" class="doctor-btn">

                                <i class="fa-solid fa-house"></i>

                                Dashboard

                            </a>

                            <a href="book-appointment.html" class="doctor-btn">

                                <i class="fa-solid fa-calendar-plus"></i>

                                Book Appointment

                            </a>

                        </div>

                    </form>

                </div>

            </section>
        </main>

    </div>

    <div class="loader"></div>

    <div class="back-to-top">
        <i class="fa-solid fa-arrow-up"></i>
    </div>

    <script src="../js/navbar.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/patient-profile.js"></script>

    <script>

        requireRole("PATIENT");

        const patient = getUserData();

        if (!patient) {
            window.location.href = "../login.html";
        }

        document.getElementById("profileName").innerText = patient.fullName || "Patient";
        document.getElementById("fullName").value = patient.fullName || "";
        document.getElementById("email").value = patient.email || "";
        document.getElementById("phone").value = patient.phone || "";
        document.getElementById("gender").value = patient.gender || "";
        document.getElementById("dob").value = patient.dob || "";
        document.getElementById("password").value = patient.password || "";

    </script>

</body>

</html>
