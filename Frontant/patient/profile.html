<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profile | OptiHealth</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animation.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../assets/logo/logo.png" alt="Logo">
                <h2>OptiHealth</h2>
            </div>

            <ul class="sidebar-menu">
                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="doctors.html">
                        <i class="fa-solid fa-user-doctor"></i>
                        <span>Doctors</span>
                    </a>
                </li>

                <li>
                    <a href="book-appointment.html">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span>Book Appointment</span>
                    </a>
                </li>

                <li>
                    <a href="appointments.html">
                        <i class="fa-solid fa-calendar-check"></i>
                        <span>My Appointments</span>
                    </a>
                </li>

                <li class="active">
                    <a href="profile.html">
                        <i class="fa-solid fa-user"></i>
                        <span>Profile</span>
                    </a>
                </li>

                <li>
                    <a href="#" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h2>My Profile</h2>
                    <p>Manage your personal information and account details.</p>
                </div>
            </header>

            <section class="profile-container">
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-image">
                            <img id="profileImage" src="../assets/images/patient.png" alt="Patient">
                        </div>
                        <div class="profile-details">
                            <h2 id="profileName">
                                Loading...
                            </h2>
                            <p>
                                <i class="fa-solid fa-user"></i>
                                OptiHealth Patient
                            </p>
                        </div>
                    </div>

                    <form id="profileForm">
                        <div class="profile-grid">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="fullName" class="form-control" readonly>
                            </div>

                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="email" class="form-control" readonly>
                            </div>

                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="text" id="phone" class="form-control" readonly>
                            </div>

                            <div class="form-group">
                                <label>Gender</label>
                                <input type="text" id="gender" class="form-control" readonly>
                            </div>

                            <div class="form-group">
                                <label>Date of Birth</label>
                                <input type="date" id="dob" class="form-control" readonly>
                            </div>
                        </div>

                        <div class="profile-actions">
                            <button type="button" class="doctor-btn" onclick="enableEdit()">
                                <i class="fa-solid fa-pen"></i>
                                Edit Profile
                            </button>

                            <button type="button" class="form-btn" id="saveProfileBtn" style="display:none"
                                onclick="updateProfile()">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <div class="loader"></div>
    <div class="back-to-top">
        <i class="fa-solid fa-arrow-up"></i>
    </div>

    <script src="../js/loader.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/patient.js"></script>
    <script src="../js/patient_profile.js"></script>

    <script>
        requireRole("PATIENT");
        loadProfile();
    </script>
</body>

</html>
